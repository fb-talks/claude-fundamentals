<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>counter</title>
    <style>
      body {
        margin: 0;
        display: grid;
        place-items: center;
        height: 100vh;
        background: #12151b;
        color: #e8ebf0;
        font: 500 clamp(18px, 5vw, 44px) / 1.4 ui-sans-serif, system-ui, sans-serif;
      }
      button {
        font: inherit;
        padding: 0.4em 1em;
        border-radius: 14px;
        border: 1px solid #2c333f;
        background: #1a1f27;
        color: #6ea8fe;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Any page can go on a slide. This one is here to prove it is really running. -->
    <button onclick="this.textContent = ++count">0</button>
    <script>
      let count = 0;
    </script>
  </body>
</html>
